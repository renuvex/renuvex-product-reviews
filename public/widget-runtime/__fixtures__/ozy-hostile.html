<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Renuvex — Ozy-hostile shadow DOM fixture</title>

  <!--
    Dev fixture for the Shadow DOM isolation work (ADR_0021).
    Served by `next dev` at:
      http://localhost:3000/widget-runtime/__fixtures__/ozy-hostile.html

    Loads the built widget bundle (run `pnpm build:widget` first) and wraps the
    review mount in a hostile container. The hostile <style> below replicates
    the Mine theme breakage (`.hOHcRx img { width:100% !important }`) and adds
    several broadly-scoped, !important-laced rules that mature widgets must
    survive: typography bleed, img filters, button reset, form colors, list
    overrides, box-sizing override. With the shadow root in place, NONE of
    these rules should reach inside the review section, lightbox, or wizard.

    To compare before/after, build the widget once with the migration and once
    on the pre-migration commit (or `git revert HEAD`) and reload.
  -->

  <style>
    /* Page chrome — neutral so the test is about widget vs hostile rules. */
    html, body { margin:0; padding:0; font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#111; background:#fff; }
    .pdp { max-width:1200px; margin:0 auto; padding:24px 16px; }
    .pdp-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; align-items:start; }
    .pdp-img { width:100%; aspect-ratio:1/1; background:#eee; border-radius:8px; }
    .pdp h1 { font-size:28px; margin:0 0 12px; }
    .pdp-price { font-size:22px; font-weight:600; margin:0 0 24px; }
    .pdp-buy { background:#111; color:#fff; padding:12px 24px; border:0; border-radius:8px; cursor:pointer; font-size:15px; }
    .pdp-desc { margin:32px 0; line-height:1.6; color:#444; }
    @media (max-width:720px) { .pdp-grid { grid-template-columns:1fr; } }

    /* ─── HOSTILE THEME CSS (simulated Mine + worst-case overrides) ────────
       Everything below is meant to bleed into our widget content in the
       light-DOM path. Once the widget moves into Shadow DOM, none of these
       rules can match elements inside the shadow tree (only inherited props
       and CSS custom properties cross the boundary). */
    .hOHcRx img { width:100% !important; height:auto !important; border:5px solid red !important; }
    .hOHcRx * { font-family:"Comic Sans MS", "Comic Sans", cursive !important; letter-spacing:0.5px !important; }
    .hOHcRx img { filter:blur(1px) saturate(2) !important; }
    .hOHcRx button { all:unset !important; color:hotpink !important; font-weight:900 !important; text-decoration:underline !important; }
    .hOHcRx input, .hOHcRx textarea, .hOHcRx select { background:lime !important; color:purple !important; border:3px dashed orange !important; padding:20px !important; }
    .hOHcRx ul, .hOHcRx ol, .hOHcRx li { list-style:square !important; color:red !important; }
    .hOHcRx * { box-sizing:content-box !important; }
    .hOHcRx svg { background:rgba(255,0,0,0.15) !important; outline:2px dotted red !important; }
  </style>
</head>
<body>
  <main class="pdp hOHcRx">
    <div class="pdp-grid">
      <div class="pdp-img" aria-hidden="true"></div>
      <div>
        <h1>Tundro Premium Shorts</h1>
        <div class="pdp-price">₺16,00</div>
        <button class="pdp-buy" type="button">Sepete Ekle</button>
        <p class="pdp-desc">
          Hostile-theme test sayfası. Aşağıdaki yorum alanı bizim widget — eğer
          Shadow DOM izolasyonu doğru çalışıyorsa görseller doğru boyutta gelir,
          yazı tipi Comic Sans olmaz, butonlar bozulmaz, formlar lime/mor olmaz.
        </p>
      </div>
    </div>

    <!-- Renuvex mount point — explicit, opt-in. The widget bootstraps when it
         finds this div on the page. The .hOHcRx parent applies the hostile
         rules; if isolation is broken, the review section's <img>/buttons/etc
         get the bad styles. -->
    <div data-renuvex-widget="reviews"></div>
  </main>

  <!-- Storefront Events mock. Real ikas storefronts expose `window.IkasEvents`;
       the widget subscribes and reads PRODUCT_VIEW data. The fixture synth-
       fires the same shape so the widget's review-section surface detects a
       product and mounts. Must run BEFORE widget.js so subscribe() finds it. -->
  <script>
    window.IkasEvents = {
      subscribe: function (sub) {
        if (!sub || typeof sub.callback !== 'function') return;
        sub.callback({ type: 'PAGE_VIEW', data: { pageType: 'PRODUCT' } });
        sub.callback({
          type: 'PRODUCT_VIEW',
          data: { productDetail: { id: 'fixture-product-1', name: 'Tundro Premium Shorts' } },
        });
      },
    };
  </script>

  <!-- Built widget bundle. Run `pnpm build:widget` first.
       publicApiKey points at dev-mertcopper.ikas.shop (the dev tenant in
       core/rollout.js); when served by `next dev` or a static server with a
       /api/public/reviews stub, the widget hits the reviews endpoint and
       mounts the section inside its Shadow DOM root. -->
  <script
    src="/widget.js?publicApiKey=02786d4b-a09b-4b36-ad8c-56e6d396f6fd"
    async
    data-renuvex-app="product-reviews"
    data-renuvex-store-id="02786d4b-a09b-4b36-ad8c-56e6d396f6fd"
  ></script>
</body>
</html>
