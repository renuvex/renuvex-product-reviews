name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install cfn-lint
        run: python -m pip install cfn-lint==1.52.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint CloudFormation templates
        run: pnpm aws:lint-templates

      - name: Validate review-email infrastructure contracts
        run: pnpm aws:review-email:validate-templates

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build widget
        run: pnpm build:widget:ci

      - name: Check widget performance budget
        run: pnpm budget:widget

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit and browser smoke tests
        run: pnpm test:ci

      - name: Syntax check generated widget assets
        run: pnpm check:widget-js

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint source
        run: pnpm lint

      - name: Audit wiki
        run: node scripts/wiki-audit.mjs

      - name: Diff whitespace check
        run: git diff --check

  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build without deployment side effects
        run: pnpm build:ci

  review-center:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT_SECRET: ci-only-secret-00000000000000000000000000000000
      NEXT_PUBLIC_DEPLOY_URL: http://localhost:3210
      REVIEW_EMAIL_ENABLED: 'true'
      SECRET_COOKIE_PASSWORD: ci-only-secret-00000000000000000000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run review-center browser tests
        run: pnpm test:review-center

      - name: Upload review-center failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-center-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: renuvex_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d renuvex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/renuvex_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/renuvex_ci?schema=public
      REVIEW_EMAIL_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/renuvex_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/renuvex_shadow?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Create shadow database
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql --username=postgres --dbname=postgres
          --set=ON_ERROR_STOP=1
          --command='CREATE DATABASE renuvex_shadow'

      - name: Apply all migrations
        run: pnpm exec prisma migrate deploy

      - name: Check migration status
        run: pnpm exec prisma migrate status

      - name: Compare migrations with the database
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-url "$DATABASE_URL"
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      - name: Verify Data API grants and RLS surface
        run: pnpm verify:supabase-data-api-surface

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration:review-email

  codegen-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Ikas generated clients
        run: pnpm codegen:check

  media-pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: pixel-android
            browser: chromium
          - project: iphone-webkit
            browser: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm build:widget

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run media project
        run: pnpm exec playwright test --config=playwright.media.config.ts tests/widget-media-cross-browser.spec.ts --project=${{ matrix.project }}

      - name: Upload media failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-${{ matrix.project }}-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
