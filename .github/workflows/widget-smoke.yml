name: Widget Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  widget-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm build:widget
        env:
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: renuvex

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run widget network smoke tests
        run: pnpm test:widget-smoke

      - name: Syntax check generated loader
        run: node --check public/widget.js

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint source
        run: pnpm lint

      - name: Diff whitespace check
        run: git diff --check

      - name: Wiki audit
        run: node scripts/wiki-audit.mjs --changed-source-check
