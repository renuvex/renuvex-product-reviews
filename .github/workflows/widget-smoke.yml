name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install cfn-lint
        run: python -m pip install cfn-lint==1.52.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint CloudFormation templates
        run: pnpm aws:lint-templates

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build widget
        run: pnpm build:widget
        env:

      - name: Check widget performance budget
        run: pnpm budget:widget

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit and browser smoke tests
        run: pnpm test:ci

      - name: Syntax check generated widget assets
        run: pnpm check:widget-js

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint source
        run: pnpm lint

      - name: Diff whitespace check
        run: git diff --check

  media-pr-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: pixel-android
            browser: chromium
          - project: iphone-webkit
            browser: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm build:widget
        env:

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run media project
        run: pnpm exec playwright test --config=playwright.media.config.ts tests/widget-media-cross-browser.spec.ts --project=${{ matrix.project }}

      - name: Upload media failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.project }}-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
