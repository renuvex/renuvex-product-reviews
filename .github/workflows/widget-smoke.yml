name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build widget
        run: pnpm build:widget
        env:
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: renuvex

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit and browser smoke tests
        run: pnpm test:ci

      - name: Syntax check generated widget assets
        run: pnpm check:widget-js

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint source
        run: pnpm lint

      - name: Diff whitespace check
        run: git diff --check
