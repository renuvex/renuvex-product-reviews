name: Media Cross-Browser

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  media-cross-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm build:widget
        env:
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: renuvex

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run full media browser matrix
        run: pnpm test:widget-media:all

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-cross-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
